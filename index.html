<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyMEs Magdalena — Mapa Interactivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;background:#f5f5f5}
#app{display:flex;height:100vh}
#sb{width:330px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;z-index:500}
#sb header{padding:16px;border-bottom:1px solid #eee}
#sb h1{font-size:15px;font-weight:600;color:#111;line-height:1.3}
#sb h1 small{display:block;color:#888;font-weight:400;font-size:12px;margin-top:2px}
#q{margin:10px 16px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:0}
#q:focus{border-color:#4285f4;box-shadow:0 0 0 3px rgba(66,133,244,.2)}
#fl{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 10px}
.ch{font:500 11px system-ui;padding:4px 10px;border-radius:12px;border:0;color:#fff;cursor:pointer;opacity:1;transition:opacity .15s}
.ch.off{opacity:.32}
#ls{flex:1;overflow-y:auto;padding:0 8px 20px}
.card{padding:9px 8px;border-bottom:1px solid #f2f2f2;cursor:pointer;border-left:3px solid transparent}
.card:hover{background:#f7f9fc;border-left-color:#4285f4}
.nm{font-size:12.5px;font-weight:500;color:#111;line-height:1.35}
.ct{font-size:11px;font-weight:600;margin-top:2px}
.cr{font-size:10px;color:#999;margin-top:1px;display:flex;justify-content:space-between;gap:6px}
#map{flex:1;height:100vh}
#top{position:absolute;top:0;left:330px;right:0;height:30px;z-index:400;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.94);border-bottom:1px solid #eee;font-size:11.5px;color:#777;pointer-events:none}
#top b{color:#333}
.lg{background:#fff;padding:9px 12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.15);font-size:11px;line-height:1.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.ap{background:transparent;border:2px dashed #999}
#msg{padding:16px;font-size:12px;color:#999}
@media(max-width:800px){#sb{position:absolute;height:45vh;width:100%;top:55vh}#top{left:0}#map{height:55vh}}
</style>
</head>
<body>
<div id="app">
  <aside id="sb">
    <header><h1>PyMEs Transporte de Alimentos<small>Magdalena, Colombia · <span id="n">…</span> empresas</small></h1></header>
    <input id="q" placeholder="Buscar empresa o ciudad…">
    <div id="fl"></div>
    <div id="ls"><div id="msg">Cargando datos…</div></div>
  </aside>
  <div id="map"></div>
</div>
<div id="top"><span><b id="ne">0</b> ubicaciones exactas · <b id="na">0</b> zonas aproximadas</span><span>Transporte de alimentos perecederos</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var SOURCES=[
  'https://raw.githubusercontent.com/pezmistico-read/pymes-magdalena-mapa/master/pymes_data.json',
  'pymes_data.json'
];
var C={'Santa Marta':'#e74c3c','Fundación':'#3498db','Ciénaga':'#27ae60','Plato':'#f39c12','Aracataca':'#8e44ad'};
var map=L.map('map').setView([-11.1,-74.2],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
L.control.scale({position:'bottomright'}).addTo(map);
map.createPane('zones');map.getPane('zones').style.zIndex=350;
var Lg=L.control({position:'bottomleft'});
Lg.onAdd=function(){var d=L.DomUtil.create('div','lg');var h='<b>Ciudades</b><br>';for(var k in C){h+='<span class="dot" style="background:'+C[k]+'"></span>'+k+'<br>';}h+='<span class="dot ap"></span>Zona aproximada';d.innerHTML=h;return d;};
Lg.addTo(map);
var P=[],MARK=[],ACTIVE={};
function tryLoad(i){
  if(i>=SOURCES.length){document.getElementById('ls').innerHTML='<div id="msg" style="color:#c00">No se pudieron cargar los datos.</div>';return;}
  fetch(SOURCES[i]).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.p||!d.p.length){throw new Error('vacio');}
    boot(d);
  }).catch(function(){tryLoad(i+1);});
}
function boot(RAW){
  P=RAW.p.map(function(o){return{id:'PYME-'+o.i,name:o.n,city:o.c,lat:o.a,lng:o.o,type:(o.t==='e'?'exacta':'aproximada'),address:o.d};});
  var Z=RAW.z;
  document.getElementById('n').textContent=P.length;
  var nex=P.filter(function(p){return p.type==='exacta';}).length;
  document.getElementById('ne').textContent=nex;
  document.getElementById('na').textContent=P.length-nex;
  for(var zc in Z){var z=Z[zc];L.circle([z[0],z[1]],{pane:'zones',radius:z[2]*1000,color:'#888',weight:1.5,dashArray:'5 5',fillColor:'#888',fillOpacity:.07}).addTo(map);}
  P.forEach(function(p){
    var e=p.type==='exacta',col=C[p.city]||'#666';
    var sz=e?16:12,bd=e?'3px solid #fff':'2px dashed #f90',op=e?1:.6;
    var ic=L.divIcon({html:'<div style="background:'+col+';width:'+sz+'px;height:'+sz+'px;border-radius:50%;border:'+bd+';opacity:'+op+';box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>',iconSize:[sz+8,sz+8]});
    var m=L.marker([p.lat,p.lng],{icon:ic}).addTo(map);
    m.bindPopup('<div style="font-family:system-ui;min-width:210px">'+
      '<div style="font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:5px">'+p.name+'</div>'+
      '<div><span style="background:'+col+';color:#fff;padding:2px 10px;border-radius:11px;font-size:11px;font-weight:600">'+p.city+'</span> <span style="color:#aaa;font-size:10px">'+p.id+'</span></div>'+
      (p.address?'<div style="color:#777;font-size:11px;margin-top:5px">'+p.address+'</div>':'')+
      '<div style="color:#999;font-size:10.5px;margin-top:5px">lat '+p.lat.toFixed(5)+' · lng '+p.lng.toFixed(5)+'</div>'+
      '<div style="margin-top:5px;font-size:11px;color:'+(e?'#27ae60':'#f39c12')+'">'+(e?'✓ Ubicación exacta (geocodificada)':'≈ Zona aproximada por ciudad')+'</div></div>');
    MARK.push({m:m,p:p});
  });
  var fl=document.getElementById('fl');
  Object.keys(C).forEach(function(key){
    ACTIVE[key]=true;
    var b=document.createElement('button');
    b.className='ch';b.style.background=C[key];b.textContent=key;
    b.onclick=function(){ACTIVE[key]=!ACTIVE[key];b.classList.toggle('off',!ACTIVE[key]);render();};
    fl.appendChild(b);
  });
  render();
}
function render(){
  if(!P.length){return;}
  var q=document.getElementById('q').value.toLowerCase();
  var ls=document.getElementById('ls');ls.innerHTML='';
  var match=function(p){return ACTIVE[p.city]&&(!q||(p.name+' '+p.city).toLowerCase().indexOf(q)>-1);};
  MARK.forEach(function(o){
    var on=match(o.p);
    if(on&&!map.hasLayer(o.m)){o.m.addTo(map);}
    if(!on&&map.hasLayer(o.m)){map.removeLayer(o.m);}
  });
  var vis=P.filter(match);
  vis.forEach(function(p){
    var e=p.type==='exacta';
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="nm">'+p.name+'</div><div class="ct" style="color:'+(C[p.city]||'#666')+'">'+p.city+'</div><div class="cr"><span>'+(e?p.lat.toFixed(4)+', '+p.lng.toFixed(4):'zona aprox.')+'</span><span style="color:'+(e?'#27ae60':'#f39c12')+'">'+(e?'✓ exacta':'≈ aprox.')+'</span></div>';
    d.onclick=function(){map.setView([p.lat,p.lng],14);MARK.filter(function(o){return o.p===p;})[0].m.openPopup();};
    ls.appendChild(d);
  });
  if(!vis.length){ls.innerHTML='<p style="padding:16px;color:#999;font-size:12px">Sin resultados</p>';}
}
document.getElementById('q').addEventListener('input',render);
tryLoad(0);
</script>
</body>
</html>
